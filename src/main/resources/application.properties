spring.application.name=FarmaSUS-Digital

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmasus_digital}
spring.datasource.username=${DB_USERNAME:farmasus}
spring.datasource.password=${DB_PASSWORD:farmasus}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.api.base-url=https://api.telegram.org

# Alternativa ao webhook para uso local. Nao habilitar junto com um webhook
# configurado no bot (setWebhook) - use um ou outro.
telegram.polling.enabled=${TELEGRAM_POLLING_ENABLED:false}
telegram.polling.interval-ms=500

reserva.expiracao.intervalo-ms=900000

reserva.lembrete.antecedencia-horas=${RESERVA_LEMBRETE_ANTECEDENCIA_HORAS:1}
reserva.lembrete.intervalo-ms=900000

conversa.timeout-minutos=${CONVERSA_TIMEOUT_MINUTOS:30}
conversa.timeout-verificacao-intervalo-ms=600000
